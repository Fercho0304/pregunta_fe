<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una pregunta importante ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff4d6d;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

#si{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4d4d;
    color:white;
    position:relative;
}
</style>
</head>
<body>

<div class="card">
    <h1>❤️ Tengo una pregunta para ti ❤️</h1>
    <h2>¿Quieres ser mi novia?</h2>

    <button id="si" onclick="aceptar()">Sí 💖</button>
    <button id="no" onmouseover="escapar()">No 😅</button>

    <p id="mensaje"></p>
</div>

<script>
function aceptar(){
    document.getElementById("mensaje").innerHTML =
    "🎉 ¡Sabía que dirías que sí! ❤️";
}

function escapar(){
    let boton = document.getElementById("no");

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 50);

    boton.style.position = "absolute";
    boton.style.left = x + "px";
    boton.style.top = y + "px";
}
</script>

</body>
</html>
